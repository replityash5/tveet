<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  *{box-sizing:border-box;}
  body{
    margin:0;
    width:{{WIDTH}}px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background: transparent;
  }
  #top-block, #bottom-block{
    background:{{BG}};
    padding:26px 30px 10px;
    width:{{WIDTH}}px;
  }
  #bottom-block{padding:10px 30px 22px;}
  .t-head{display:flex;gap:14px;align-items:center;}
  .t-avatar{width:72px;height:72px;border-radius:50%;object-fit:cover;flex-shrink:0;background:#333;}
  .t-avatar-fallback{
    width:72px;height:72px;border-radius:50%;flex-shrink:0;display:none;
    align-items:center;justify-content:center;font-weight:800;font-size:30px;color:#fff;
    background:linear-gradient(135deg,#3b82f6,#8b5cf6);
  }
  .t-nameline{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .t-name{font-weight:800;font-size:21px;color:{{TEXT}};letter-spacing:-0.2px;}
  .t-badge{width:24px;height:24px;flex-shrink:0;display:{{VERIFIED_DISPLAY}};}
  .t-handle{color:{{SUB}};font-size:20px;}
  .t-text{font-size:24px;line-height:1.42;color:{{TEXT}};margin:18px 0 8px;word-wrap:break-word;}
  .t-time{color:{{SUB}};font-size:18px;padding:14px 0;border-bottom:1px solid {{BORDER}};}
  .t-time b{color:{{TEXT}};}
  .t-actions{display:flex;justify-content:space-between;max-width:560px;padding:12px 0 2px;color:{{SUB}};}
  .t-action{display:flex;align-items:center;gap:8px;font-size:17px;}
  .t-action svg{width:25px;height:25px;flex-shrink:0;}

  /* Corner Box Container */
  .corner{
    display: block;
    width:{{CORNER_R}}px;
    height:{{CORNER_R}}px;
    line-height: 0;
  }
  .corner svg{
    display: block;
    width:{{CORNER_R}}px;
    height:{{CORNER_R}}px;
  }
</style>
</head>
<body>

<div id="top-block">
  <div class="t-head">
    <img class="t-avatar" src="{{AVATAR}}" crossorigin="anonymous"
      onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
    <div class="t-avatar-fallback">{{INITIAL}}</div>
    <div>
      <div class="t-nameline">
        <span class="t-name">{{NAME}}</span>
        <svg class="t-badge" viewBox="0 0 22 22" fill="#1d9bf0"><path d="M20.396 11c-.018-.646-.215-1.275-.57-1.816-.354-.54-.852-.972-1.438-1.246.223-.607.27-1.264.14-1.897-.131-.634-.437-1.218-.884-1.688-.47-.447-1.054-.752-1.688-.884-.633-.13-1.29-.083-1.897.14-.273-.587-.704-1.086-1.245-1.44S11.647 1.62 11 1.604c-.646.017-1.273.213-1.813.568s-.972.854-1.245 1.44c-.607-.223-1.264-.27-1.897-.14-.634.132-1.218.437-1.688.884-.447.47-.752 1.054-.884 1.688-.13.633-.083 1.29.14 1.897-.587.274-1.086.706-1.44 1.246-.353.54-.55 1.17-.568 1.816.018.646.215 1.276.57 1.817.354.54.852.972 1.438 1.246-.223.607-.27 1.264-.14 1.897.131.634.437 1.218.884 1.688.47.447 1.054.752 1.688.884.633.13 1.29.083 1.897-.14.274.587.705 1.086 1.245 1.44s1.167.551 1.813.569c.647-.02 1.272-.216 1.813-.571s.972-.854 1.245-1.44c.607.224 1.264.271 1.898.14.634-.131 1.218-.437 1.688-.884.447-.47.752-1.054.884-1.688.13-.633.083-1.29-.14-1.896.586-.274 1.084-.706 1.438-1.246.354-.54.551-1.17.569-1.816zM9.662 14.85l-3.429-3.428 1.293-1.293 2.136 2.136 4.44-4.44 1.293 1.293-5.733 5.732z"/></svg>
        <span class="t-handle">@{{HANDLE}}</span>
      </div>
    </div>
  </div>
  <div class="t-text">{{TWEET_TEXT}}</div>
</div>

<div id="bottom-block">
  <div class="t-time"><b>{{TIME}}</b> &middot; {{DATE}}{{VIEWS_ROW}}</div>
  <div class="t-actions">
    <span class="t-action">
      <svg viewBox="0 0 24 24"><path d="M1.75 12c0-5.11 4.14-9.25 9.25-9.25h2c5.11 0 9.25 4.14 9.25 9.25s-4.14 9.25-9.25 9.25h-.05c-1.6 0-3.1-.35-4.4-1a10.7 10.7 0 0 1-4.9 1.2.66.66 0 0 1-.6-.98c.32-.6.6-1.3.7-2.1A9.2 9.2 0 0 1 1.75 12z" fill="none" stroke="{{SUB}}" stroke-width="1.6"/></svg>
      {{REPLIES}}
    </span>
    <span class="t-action">
      <svg viewBox="0 0 24 24"><path d="M4.5 3v9a4 4 0 0 0 4 4h9m0 0-3.5-3.5M17.5 16 14 19.5M19.5 21v-9a4 4 0 0 0-4-4h-9m0 0L10 4.5M6.5 8 3 4.5" fill="none" stroke="{{SUB}}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </span>
    <span class="t-action">
      <svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-10-9.3C.5 8.4 2 5 5.3 4.2 7.7 3.6 10 4.8 12 7c2-2.2 4.3-3.4 6.7-2.8C22 5 23.5 8.4 22 11.7 19.5 16.4 12 21 12 21z" fill="none" stroke="{{SUB}}" stroke-width="1.6" stroke-linejoin="round"/></svg>
      {{LIKES}}
    </span>
    <span class="t-action">
      <svg viewBox="0 0 24 24"><path d="M6 3.5h12a1 1 0 0 1 1 1V21l-7-4.5L5 21V4.5a1 1 0 0 1 1-1z" fill="none" stroke="{{SUB}}" stroke-width="1.6" stroke-linejoin="round"/></svg>
    </span>
    <span class="t-action">
      <svg viewBox="0 0 24 24"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M12 15V3m0 0L7.5 7.5M12 3l4.5 4.5" fill="none" stroke="{{SUB}}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </span>
  </div>
</div>

<!-- Precision Vector SVG Corner Masks (Corrected Corner Vectors) -->
<div id="corner-tl" class="corner">
  <svg width="{{CORNER_R}}" height="{{CORNER_R}}" viewBox="0 0 {{CORNER_R}} {{CORNER_R}}">
    <path d="M 0 0 H {{CORNER_R}} A {{CORNER_R}} {{CORNER_R}} 0 0 0 0 {{CORNER_R}} Z" fill="{{BG}}"/>
  </svg>
</div>
<div id="corner-tr" class="corner">
  <svg width="{{CORNER_R}}" height="{{CORNER_R}}" viewBox="0 0 {{CORNER_R}} {{CORNER_R}}">
    <path d="M {{CORNER_R}} 0 V {{CORNER_R}} A {{CORNER_R}} {{CORNER_R}} 0 0 0 0 0 Z" fill="{{BG}}"/>
  </svg>
</div>
<div id="corner-bl" class="corner">
  <svg width="{{CORNER_R}}" height="{{CORNER_R}}" viewBox="0 0 {{CORNER_R}} {{CORNER_R}}">
    <path d="M 0 {{CORNER_R}} V 0 A {{CORNER_R}} {{CORNER_R}} 0 0 0 {{CORNER_R}} {{CORNER_R}} Z" fill="{{BG}}"/>
  </svg>
</div>
<div id="corner-br" class="corner">
  <svg width="{{CORNER_R}}" height="{{CORNER_R}}" viewBox="0 0 {{CORNER_R}} {{CORNER_R}}">
    <path d="M {{CORNER_R}} {{CORNER_R}} H 0 A {{CORNER_R}} {{CORNER_R}} 0 0 0 {{CORNER_R}} 0 Z" fill="{{BG}}"/>
  </svg>
</div>

</body>
</html>
