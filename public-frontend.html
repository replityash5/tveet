<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tweet Video Generator (Server Edition)</title>
<style>
  body{background:#0a0a0a;color:#e7e9ea;font-family:-apple-system,Segoe UI,Roboto,sans-serif;max-width:640px;margin:0 auto;padding:24px 16px 80px;}
  h1{font-size:18px;text-align:center;margin-bottom:4px;}
  .sub{text-align:center;color:#71767b;font-size:13px;margin-bottom:24px;}
  label{display:block;font-size:12px;color:#71767b;margin:12px 0 6px;}
  input, select{width:100%;background:#000;border:1px solid #2f3336;border-radius:8px;color:#e7e9ea;padding:10px 12px;font-size:14px;}
  button{background:#1d9bf0;color:#fff;border:none;border-radius:999px;padding:12px 18px;font-weight:700;font-size:14px;cursor:pointer;width:100%;margin-top:16px;}
  button:disabled{opacity:.5;}
  .status{font-size:13px;margin-top:10px;min-height:18px;}
  .status.error{color:#f4212e;}
  .status.ok{color:#00ba7c;}
  video{width:100%;border-radius:12px;margin-top:16px;background:#000;}
</style>
</head>
<body>

<h1>Tweet Video Generator — Server Edition</h1>
<p class="sub">Server-side render. No screen recording, no real-time wait.</p>

<label>Server URL (from your Render deployment)</label>
<input id="apiBase" placeholder="https://your-service.onrender.com" value="">

<label>Tweet / X post URL</label>
<input id="tweetUrl" placeholder="https://x.com/username/status/1234567890">

<label>Theme</label>
<select id="theme">
  <option value="dark">Lights out (black)</option>
  <option value="dim">Dim</option>
  <option value="light">Default (white)</option>
</select>

<button id="genBtn">Generate video</button>
<div class="status" id="status"></div>
<video id="preview" controls style="display:none;"></video>

<script>
const $ = id => document.getElementById(id);

// If this page is being served from the render server itself (recommended),
// auto-fill the Server URL field so there's nothing to paste.
if (location.protocol.startsWith('http')) {
  $('apiBase').value = location.origin;
}

$('genBtn').addEventListener('click', async () => {
  const base = $('apiBase').value.trim().replace(/\/$/, '');
  const tweetUrl = $('tweetUrl').value.trim();
  const theme = $('theme').value;
  const statusEl = $('status');
  const btn = $('genBtn');

  if(!base){ statusEl.textContent = 'Enter your deployed server URL first.'; statusEl.className='status error'; return; }
  if(!tweetUrl){ statusEl.textContent = 'Paste a tweet URL first.'; statusEl.className='status error'; return; }

  btn.disabled = true;
  statusEl.textContent = 'Rendering on server… (a 20-min video typically takes a couple of minutes, not 20)';
  statusEl.className = 'status';
  $('preview').style.display = 'none';

  try{
    const res = await fetch(`${base}/api/render-video`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ tweetUrl, theme, width: 1080 }),
    });
    if(!res.ok){
      const err = await res.json().catch(() => ({error: 'HTTP ' + res.status}));
      throw new Error(err.error || 'Server error');
    }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    $('preview').src = url;
    $('preview').style.display = 'block';

    const a = document.createElement('a');
    a.href = url;
    a.download = 'tweet-video.mp4';
    a.click();

    statusEl.textContent = 'Done — downloaded tweet-video.mp4';
    statusEl.className = 'status ok';
  }catch(err){
    console.error(err);
    statusEl.textContent = 'Failed: ' + err.message;
    statusEl.className = 'status error';
  }
  btn.disabled = false;
});
</script>
</body>
</html>
